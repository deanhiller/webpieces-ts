name: CI

on:
    pull_request:
        branches: [main]

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        # A wedged job is worse than a failed one: it reports "pending" forever while holding a
        # runner, and whoever is waiting cannot tell it apart from a slow build. Run 35722585020
        # stopped producing output 10 seconds into the CI step and sat there for 95 minutes before a
        # human killed it, reaping 8 orphan vitest processes on the way out. With no
        # `timeout-minutes` the job inherits GitHub's default of 360.
        #
        # 30 is ~2x the worst honest run measured over the last 15 (3.5-15.9 min, the two most recent
        # toolchain bumps at 11.9 and 12.6), so a cold Nx cache plus a base-package change that makes
        # nearly every project affected still fits comfortably. A timed-out job keeps its log, which
        # is what makes the wedge diagnosable at all.
        timeout-minutes: 30

        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Install pnpm
              uses: pnpm/action-setup@v5
              # Version is read automatically from packageManager in package.json

            - name: Setup Node.js 24
              uses: actions/setup-node@v5
              with:
                  node-version: '24.x'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Chromium for generated-client integration tests
              run: pnpm exec playwright install --with-deps chromium

            - name: Install Graphviz for runtime layout regression tests
              run: sudo apt-get update && sudo apt-get install -y graphviz

            - name: Ensure Nx cache directory exists
              run: mkdir -p .nx/cache .nx/workspace-data

            - name: Restore Nx cache
              # RESTORE ONLY. A PR reads the cache main's release.yml saved (a PR run can read its base
              # branch's caches) and never saves its own: every PR used to save a ~440 MB copy, which put
              # the repo over GitHub's 10 GB cache limit (issue #1363). The db is restored with the
              # outputs because nx serves only hashes its db lists — see scripts/ci-nx-cache.sh. The path
              # list must stay identical to release.yml's, or the restore never matches what it saved.
              # There is no bare nx-<os>- fallback: a lockfile change starts from an empty cache.
              uses: actions/cache/restore@v5
              with:
                  path: |
                      .nx/cache
                      .nx/workspace-data/*.db
                  key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.js', '!**/node_modules/**', '!**/dist/**') }}
                  restore-keys: |
                      nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

            - name: Adopt the restored Nx cache db
              # nx names its db after the machine id, which differs between runners; without the rename
              # nx opens an empty db and every restored output is a miss.
              run: bash scripts/ci-nx-cache.sh adopt-db

            - name: Run branch-appropriate CI checks
              # --parallel=4 matches the 4 vCPUs on ubuntu-latest (nx defaults to 3). A core-package
              # change makes nearly every project "affected", so this overlaps the independent branches
              # of the task graph; the win is bounded by the serial dependency chain (core-util builds
              # before its dependents).
              # Keep the entrypoint and Nx executors on the same pinned published toolchain.
              # Package tests exercise local source through the TypeScript/Vitest aliases.
              run: pnpm wp-ci --base=origin/main --parallel=4

            - name: Upload coverage
              uses: codecov/codecov-action@v6
              with:
                  files: ./coverage/lcov.info
                  fail_ci_if_error: false
              continue-on-error: true
