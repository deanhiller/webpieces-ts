name: CI

on:
    pull_request:
        branches: [main]

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        # A wedged job is worse than a failed one: it reports "pending" forever while holding a
        # runner, and whoever is waiting cannot tell it apart from a slow build. Run 35722585020
        # stopped producing output 10 seconds into the CI step and sat there for 95 minutes before a
        # human killed it, reaping 8 orphan vitest processes on the way out. With no
        # `timeout-minutes` the job inherits GitHub's default of 360.
        #
        # 30 is ~2x the worst honest run measured over the last 15 (3.5-15.9 min, the two most recent
        # toolchain bumps at 11.9 and 12.6), so a cold Nx cache plus a base-package change that makes
        # nearly every project affected still fits comfortably. A timed-out job keeps its log, which
        # is what makes the wedge diagnosable at all.
        timeout-minutes: 30

        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Install pnpm
              uses: pnpm/action-setup@v5
              # Version is read automatically from packageManager in package.json

            - name: Setup Node.js 24
              uses: actions/setup-node@v5
              with:
                  node-version: '24.x'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Ensure Nx cache directory exists
              run: mkdir -p .nx/cache

            - name: Cache Nx
              uses: actions/cache@v5
              with:
                  path: .nx/cache
                  key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.js', '!**/node_modules/**', '!**/dist/**') }}
                  restore-keys: |
                      nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
                      nx-${{ runner.os }}-

            - name: Run branch-appropriate CI checks
              # --parallel=4 matches the 4 vCPUs on ubuntu-latest (nx defaults to 3). A core-package
              # change makes nearly every project "affected", so this overlaps the independent branches
              # of the task graph; the win is bounded by the serial dependency chain (core-util builds
              # before its dependents).
              run: TS_NODE_PROJECT=tsconfig.base.json node -r @swc-node/register -r tsconfig-paths/register packages/tooling/code-rules/src/wp-ci.ts --base=origin/main --parallel=4

            - name: Upload coverage
              uses: codecov/codecov-action@v6
              with:
                  files: ./coverage/lcov.info
                  fail_ci_if_error: false
              continue-on-error: true
