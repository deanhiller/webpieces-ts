packages:
  - 'packages/rules'
  - 'packages/core/*'
  - 'packages/http/*'
  - 'packages/cloud/*'
  - 'packages/docs/*'
  - 'packages/logging/*'
  - 'packages/tooling/*'
  - 'libraries/apis/*'
  - 'apps/app-example/*'

# THE PUBLISHED @webpieces RELEASE THIS REPO IS BUILT WITH.
# Local packages/tooling/* use workspace:* to build the tooling source. This catalog
# instead installs the published toolchain used by Nx, wp-* commands, hooks, and ESLint.
# webpieces-tooling is the complete installation umbrella; its children are pinned
# together by the release. nx.json still registers @webpieces/nx-webpieces-rules.
catalog:
  '@webpieces/webpieces-tooling': 0.4.848
  # The OpenAPI 3.1 validator the openapi-generator suite checks every generated document against
  # (#1058). A test-only dependency, pinned exact; it is not a @webpieces release.
  '@seriousme/openapi-schema-validator': 2.11.0
